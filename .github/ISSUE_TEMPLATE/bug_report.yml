name: Bug report
description: Report a reproducible problem without including private email data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, real message contents, personal information, or sensitive attachments."
  - type: input
    id: version
    attributes:
      label: Emargy Mail version
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Use anonymized or synthetic examples only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

